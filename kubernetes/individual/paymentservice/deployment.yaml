apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: disamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
    spec:
      containers:
        - name: paymentservice
          image: disamart/paymentservice:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: disamart-config
          env:
            - name: SQLSERVER_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disamart-secrets
                  key: sql-sa-password
            - name: ConnectionStrings__PaymentDb
              value: "Server=sqlserver,1433;Database=PaymentDB;User Id=sa;Password=$(SQLSERVER_SA_PASSWORD);TrustServerCertificate=True"
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
