server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/catalog/ { proxy_pass http://productcatalogservice:8080/; }
    location /api/cart/ { proxy_pass http://cartservice:8080/; }
    location /api/checkout/ { proxy_pass http://checkoutservice:8080/; }
    location /api/payment/ { proxy_pass http://paymentservice:8080/; }
    location /api/shipping/ { proxy_pass http://shippingservice:8080/; }
    location /api/email/ { proxy_pass http://emailservice:8080/; }
    location /api/ad/ { proxy_pass http://adservice:8080/; }
    location /api/currency/ { proxy_pass http://currencyservice:8080/; }
    location /api/customization/ { proxy_pass http://customizationservice:8080/; }
    location /api/recommendation/ { proxy_pass http://recommendationservice:8080/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
