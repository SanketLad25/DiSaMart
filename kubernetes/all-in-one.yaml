apiVersion: v1
kind: Namespace
metadata:
  name: disamart
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: disamart-config
  namespace: disamart
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Services__Cart: http://cartservice:8080
  Services__Payment: http://paymentservice:8080
  Services__Shipping: http://shippingservice:8080
  Services__Email: http://emailservice:8080
  TARGET_CATALOG_URL: http://productcatalogservice:8080
---
apiVersion: v1
kind: Secret
metadata:
  name: disamart-secrets
  namespace: disamart
type: Opaque
stringData:
  sql-sa-password: REPLACE_ME_Str0ng!
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  namespace: disamart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  namespace: disamart
spec:
  type: ClusterIP
  selector:
    app: sqlserver
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: disamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1800"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disamart-secrets
                  key: sql-sa-password
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 750m
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1"
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: disamart-db-init
  namespace: disamart
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: disamart-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: disamart/database-init:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: sqlserver
            - name: SQLSERVER_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: disamart-secrets
                  key: sql-sa-password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: disamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
    spec:
      containers:
        - name: adservice
          image: disamart/adservice:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: disamart-config
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: disamart
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
    - name: http
      port: 8080
      targetPort: 8080
